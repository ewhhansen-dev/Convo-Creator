[project]
name = "convo-creator"
version = "0.1.0"
description = "A local dictation and AI interaction tool."
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "mido>=1.3.0",
    "python-rtmidi>=1.5.8",
    "flet>=0.21.0",
    "pyperclip>=1.8.2"
]

[tool.setuptools]
packages = ["src"]
